<form action="">

<h1>  My feedback  </h1>

<!-- bloque 1 -->
 <div>
    <label for="Name">Nombre y Apellido</label>
    <input type="text" id="Name" name="Name" required>
    <label for="Email">Email</label>
    <input type="text" id="Email" name="Email" required>
    <label for="password">Password</LAbel>
    <input type="password" id="password" name="password" required>
 </div>

 <!-- bloque 2 -->
 <div> 
 <h2>  Please check all the emotios that apply to you  </h2>
 <label for="angry">  Angry  </label>
 <input type="checkbox" id="angry" name="emotions">
 <label for="sad">  Sad  </label>
 <input type="checkbox" id="sad" name="emotions">
 <label for="happy">  Happy  </label>
 <input type="checkbox" id="happy" name="emotions">
 <label for="ambivalent">  Ambivalent  </label>
 <input type="checkbox" id="ambivalent" name="emotions">
</div>


<!-- bloque 3 -->
 <div> 
 <h2>  How satisfied were you with our servicie ?   </h2>
 <label for="verysatisfied">  Very satisfied  </label>
 <input type="radio" id="verysatisfied" name="satisfaction">
 <label for="satisfied">  Satisfied  </label>
 <input type="radio" id="satisfied" name="satisfaction">
 <label for="didn'tcare">  Didn't care  </label>
 <input type="radio" id="didn'tcare" name="satisfaction">
 <label for="dissatisfied">  Dissatisfied  </label>
 <input type="radio" id="dissatisfied" name="satisfaction">
 <label for="verydissatisfied">  Very dissatisfied  </label>
 <input type="radio" id="verydissatisfied" name="satisfaction">
</div>


<!-- bloque 4 -->
 <div> 
  <label for="comments">  Further comments  </label>
 <textarea id="comments" name="comments" rows="10" cols="30">
</textarea>
</div>


<!-- bloque 5 -->
 <div> 
  <label for="biophoto">  Bio photo  </label>
 <input type="file" id="biophoto" name="biophoto" accept="image/*">
</div>

<!-- bloque 6 -->
<div>
<label for="locationvisited">  Location visited  </label>
<select name="location" id="locationvisited" name="location" required>
<option value="mardelplata">  Mar del Plata  </option>
<option value="villagesell">  Villa Gesell  </option>
<option value="miramar">  Miramar  </option>
<option value="NO" selected disabled>  Choose  </option> 
<!-- el disable escribe en gris la palabra Choose y no permite elegirlo -->   
</select>
</div>


<!-- bloque 7 -->
<div>
<button type="submit">  submit  </button>

</div>
